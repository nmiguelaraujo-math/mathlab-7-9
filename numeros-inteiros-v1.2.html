<script>

  function E(prompt,statement,answer,steps,opts={}){return {prompt,statement,answer,steps,choices:opts.choices||null,correct:opts.correct??null,visual:opts.visual||null,family:opts.family||''}}
  function mc(prompt,statement,correctAnswer,wrong,steps,family){let options=shuffle([correctAnswer,...wrong].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4));while(options.length<4)options.push(String(ri(-15,15)));options=[...new Set(options)];while(options.length<4){const x=String(ri(-20,20));if(!options.includes(x))options.push(x)}options=shuffle(options.slice(0,4));return E(prompt,statement,correctAnswer,steps,{choices:options,correct:options.indexOf(correctAnswer),family})}

  function concept(level){const type=pick(level===1?['opposite','absolute','line','membership']:level===2?['oppositeInverse','absPair','line','membership','distance']:['absPair','nestedOpposite','membership','distance','line']);

    if(type==='oppositeInverse'){const s=nonzero(level),n=-s;return E(`O simétrico de um número é ${s}. Qual é esse número?`,`\\(-\\square=${s}\\)`,z(n),[S(`-${signed(n)}=${s}`),S(`\\square=${n}`,'O simétrico do simétrico de um número é o próprio número.')],{family:'simétrico-inverso'})}
    if(type==='absolute'){const n=nonzero(level);return E('Determina o valor absoluto.',`\\[|${n}|\\]`,z(abs(n)),[S(`|${n}|=${abs(n)}`,'O valor absoluto é a distância do número ao zero.')],{family:'valor-absoluto'})}

    if(type==='nestedOpposite'){const n=nonzero(level),depth=pick([2,3,4]);let expr=z(n);for(let i=0;i<depth;i++)expr=`-(${expr})`;const result=depth%2===0?n:-n;return E('Simplifica, determinando sucessivamente os simétricos.',`\\[${expr}\\]`,z(result),[S(`${expr}=${result}`,'Cada sinal exterior determina o simétrico da expressão que se segue.')],{family:'simétricos-sucessivos'})}

    if(type==='distance'){const a=ri(2,range(level)),side=pick(['negativo','positivo']),n=side==='negativo'?-a:a;return E(`Que número inteiro está a ${a} unidades do zero e é ${side}?`,`\\[|\\square|=${a}\\]`,z(n),[S(`|${n}|=${a}`),S(`\\square=${n}`,'A condição sobre o sinal permite escolher um dos dois números.')],{family:'distância'})}

    if(type==='pair'||type==='pairAbs'||type==='pairNested'){let a=nonzero(level),b=nonzero(level),A=z(a),B=z(b),va=a,vb=b;if(type==='pairAbs'){A=`|${a}|`;B=`|${b}|`;va=abs(a);vb=abs(b)}if(type==='pairNested'){A=`-${signed(a)}`;B=`${b}`;va=-a;vb=b}if(va===vb){if(type==='pairAbs'){b=b>=0?b+1:b-1;B=`|${b}|`;vb=abs(b)}else{b+=1;B=z(b);vb=b}}const rel=va<vb?'<':'>';return E('Substitui o espaço por < ou >.',`\\[${A}\\quad\\square\\quad${B}\\]`,rel,[...(type==='pairAbs'?[S(`${A}=${va}\\quad\\text{e}\\quad${B}=${vb}`,'Calculam-se os valores absolutos.')]:type==='pairNested'?[S(`${A}=${va}`,'Determina-se primeiro o simétrico.')]:[]),S(`${va}${rel}${vb}`,'Na reta numérica, o menor número encontra-se mais à esquerda.')],{family:type})}
    if(type==='order'){const count=level===1?4:level===2?5:6,set=new Set;while(set.size<count)set.add(ri(-range(level),range(level)));const arr=shuffle([...set]),sorted=[...arr].sort((a,b)=>a-b);return E('Ordena por ordem crescente.',`\\[${arr.join(',\\quad')}\\]`,sorted.join('<'),[S(sorted.join('<'),'Na reta numérica, os números aumentam da esquerda para a direita.')],{family:'ordenar'})}
    if(type==='between'||type==='betweenAll'){const a=ri(-range(level),range(level)-4),gap=type==='between'?ri(2,5):ri(4,8),b=a+gap,vals=[];for(let n=a+1;n<b;n++)vals.push(n);return E(type==='between'?'Indica um número inteiro que torne a desigualdade verdadeira.':'Indica todos os números inteiros que tornam a desigualdade verdadeira.',`\\[${a}<\\square<${b}\\]`,type==='between'?z(pick(vals)):vals.join(',\\;'),[S(`${a}<${vals.join(',\\;')}<${b}`,'Procuram-se os inteiros situados estritamente entre os extremos.')],{family:type})}
    if(type==='sign'){const neg=-ri(30,70),p1=ri(5,20),p2=ri(5,20),sum=neg+p1+p2,sgn=sum<0?'negativo':sum>0?'positivo':'zero';return E('Sem efetuar todos os cálculos, indica o sinal da expressão.',`\\[${neg}+${p1}+${p2}\\]`,sgn,[S(`${p1}+${p2}=${p1+p2}`,'Agrupam-se mentalmente os termos positivos.'),S(`${abs(neg)}${abs(neg)>p1+p2?'>':'<'}${p1+p2}`),S(`\\text{O resultado é ${sgn}.}`)],{family:'determinar-sinal'})}

  function operations(level){const type=pick(level===1?['add','subtract','zero']:level===2?['add','subtractNegative','missing','error']:['missing','error','property','chain']);const R=range(level);
    if(type==='add'||type==='zero'){const a=type==='zero'?nonzero(level):ri(-R,R),b=type==='zero'?-a:ri(-R,R),v=a+b;return E('Calcula.',`\\[${signed(a)}+${signed(b)}\\]`,z(v),[S(`${signed(a)}+${signed(b)}=${v}`,a*b>=0?'Adicionam-se os valores absolutos e conserva-se o sinal comum.':'Subtraem-se os valores absolutos e conserva-se o sinal do termo com maior valor absoluto.')],{family:type})}
    if(type==='subtract'||type==='subtractNegative'){const a=ri(-R,R),b=type==='subtractNegative'?-ri(1,R):ri(-R,R),v=a-b;return E('Calcula, transformando a subtração numa adição.',`\\[${signed(a)}-${signed(b)}\\]`,z(v),[S(`${signed(a)}-${signed(b)}=${signed(a)}+${signed(-b)}`,'Subtrair um número é adicionar o seu simétrico.'),S(`${signed(a)}+${signed(-b)}=${v}`)],{family:'subtração'})}

  }
  function expressions(level){const type=pick(level===1?['parentheses','equivalence']:level===2?['parentheses','strategy','insert','equivalence']:['strategy','sign','insert','nested','conjecture']);const R=range(level);
    if(type==='parentheses'||type==='nested'){const a=ri(-R,R),b=ri(-R,R),c=ri(-R,R),inside=b+c,v=a-inside;return E('Calcula, respeitando os parênteses.',`\\[${signed(a)}-(${signed(b)}+${signed(c)})\\]`,z(v),[S(`${signed(a)}-(${signed(b)}+${signed(c)})`),S(`${signed(a)}-${signed(inside)}`,'Calcula-se primeiro o que está entre parênteses.'),S(`${signed(a)}+${signed(-inside)}`,'A subtração é transformada em adição do simétrico.'),S(z(v))],{family:type})}

    const n=ri(2,15),claim=pick(['odd','even']),correct=claim==='odd',answer=correct?'Verdadeira':'Falsa';return E(`Decide se a afirmação é verdadeira ou falsa e justifica: “A soma de dois inteiros consecutivos é sempre ${claim==='odd'?'ímpar':'par'}.”`,`\\[n+(n+1)\\]`,answer,[S(`n+(n+1)=2n+1`),S('\\text{O número }2n\\text{ é par; ao adicionar 1 obtém-se um número ímpar.}'),S(`\\text{A afirmação é ${answer.toLowerCase()}.}`)],{family:'conjetura'})

  function problems(level){const type=pick(level===1?['temperature','elevator','game']:level===2?['temperature','elevator','balance','diver','game']:['inverseElevator','inverseTemperature','balance','diver','reference']);const R=range(level);
    if(type==='temperature'){const start=ri(-10,5),rise=ri(2,10),fall=level===1?0:ri(1,8),v=start+rise-fall;return E(`A temperatura era de \\(${start}^\\circ\\text{C}\\). Depois subiu \\(${rise}^\\circ\\text{C}\\)${fall?` e desceu \\(${fall}^\\circ\\text{C}\\)`:''}. Qual é a temperatura final?`,`\\[${start}+${rise}${fall?`-${fall}`:''}\\]`,`\\(${v}^\\circ\\text{C}\\)`,[S(`${start}+${rise}${fall?`-${fall}`:''}=${v}`),S(`\\text{Temperatura final: }${v}^\\circ\\text{C}.`)],{family:'temperatura'})}

    if(type==='game'){const a=ri(3,12),b=ri(4,15),c=level===1?0:ri(2,10),v=a-b+c;return E(`Num jogo, a Leonor ganha ${a} pontos, perde ${b}${c?` e volta a ganhar ${c}`:''}. Qual é a variação total da pontuação?`,`\\[${a}-${b}${c?`+${c}`:''}\\]`,z(v),[S(`${a}-${b}${c?`+${c}`:''}=${v}`),S(`\\text{A variação total é }${v}\\text{ pontos.}`)],{family:'pontuação'})}
