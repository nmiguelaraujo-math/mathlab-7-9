<script>

function selection(level){const type=pick(level===1?['mcDirect','trueFalse']:level===2?['mcDirect','trueFalse','findError']:['mcDirect','findError','strategy','oddOne','method','method']);
 if(type==='mcDirect'){const x=randomDecimal(level),q=x.q,wrong=[tex(Q(q.n+1,q.d)),tex(Q(q.n,q.d+1)),tex(Q(x.r,x.den))];return MC('Seleciona a fração irredutível que representa a dízima.',`\\[${decTex(x)}\\]`,tex(q),wrong,conversionSteps(x),'seleção-fração')}
 if(type==='trueFalse'){const x=randomDecimal(level),isTrue=Math.random()<.5,candidate=isTrue?x.q:Q(x.q.n+pick([-1,1]),x.q.d);return E('Indica se a igualdade é verdadeira ou falsa.',`\\[${decTex(x)}=${tex(candidate)}\\]`,isTrue?'Verdadeira':'Falsa',[...conversionSteps(x),S(isTrue?'\\text{A igualdade é verdadeira.}':'\\text{A igualdade é falsa.}',`A fração correta é ${x.q.n}/${x.q.d}.`)],{family:'verdadeiro-falso'})}
 if(type==='findError'){const x=randomDecimal(Math.max(2,level)),wrongDen=x.nines,wrong=Q(x.integer*wrongDen+x.p*x.nines+x.r,wrongDen);return E('A resolução contém um erro. Identifica-o e corrige o resultado.',`\\[${decTex(x)}=\\frac{${x.integer*wrongDen+x.p*x.nines+x.r}}{${wrongDen}}=${tex(wrong)}\\]`,tex(x.q),[S(`\\text{Não foram consideradas as ${x.k} casas do antiperíodo.}`,'O denominador deve incluir um zero por cada algarismo não periódico.',true),...conversionSteps(x)],{family:'detetar-erro'})}

 if(type==='method'){const x=randomDecimal(3),mult=10**(x.k+x.m),small=10**x.k,wholeA=x.integer*mult+(x.prefix?Number(x.prefix)*10**x.m:0)+x.r,wholeB=x.integer*small+(x.prefix?Number(x.prefix):0),correct=`${mult}x-${small}x=${wholeA}-${wholeB}`;return MC('Seja \\(x\\) a dízima apresentada. Seleciona a subtração que elimina corretamente a parte periódica.',`\\[x=${decTex(x)}\\]`,correct,[`${mult}x-x=${wholeA}-${wholeB}`,`${small}x-x=${wholeA}-${wholeB}`,`${mult}x+${small}x=${wholeA}+${wholeB}`],[S(`${mult}x=${wholeA},(${x.period})`),S(`${small}x=${wholeB},(${x.period})`),S(correct,'As partes periódicas iguais anulam-se na subtração.')],'seleção-método')}
 const x=randomDecimal(3),same=[tex(x.q),`\\frac{${x.q.n*2}}{${x.q.d*2}}`,`\\frac{${x.q.n*3}}{${x.q.d*3}}`],odd=Q(x.q.n+1,x.q.d),oddTex=tex(odd);const options=shuffle([...same,oddTex]);return E('Seleciona a única representação que não é equivalente às restantes.','',oddTex,[S(`${decTex(x)}=${tex(x.q)}`),S(`${same[1]}=${same[0]}\\quad\\text{e}\\quad${same[2]}=${same[0]}`),S(`${oddTex}\\ne${tex(x.q)}`)],{family:'representação-intrusa',choices:options,correct:options.indexOf(oddTex)})
}
const names={convert:'Dízima em fração',recognise:'Reconhecer e classificar',complete:'Completar e relacionar',compare:'Comparar e ordenar',problems:'Problemas',selection:'Seleção e análise de erros'},generators={convert,recognise,complete,compare,problems,selection};
let recent=[];function make(){const level=+$('#level').value;let category=$('#category').value;if(category==='mixed'){const pool=level===1?['convert','convert','recognise','complete','problems','selection']:level===2?['convert','convert','complete','compare','problems','selection','recognise']:['convert','convert','complete','compare','problems','problems','selection'];category=pick(pool)}let e=generators[category](level),tries=0;while(recent.includes(e.family)&&tries++<8)e=generators[category](level);recent=[e.family,...recent].slice(0,3);return {...e,level,category}}
const rules=`<ul><li>Uma <strong>dízima finita</strong> tem um número limitado de casas decimais.</li><li>Numa <strong>dízima infinita periódica</strong>, o período escreve-se entre parênteses: por exemplo, \\(0,(3)\\), \\(0,(6)\\) ou \\(1,42(3)\\).</li><li>Neste módulo, o período é sempre o algarismo <strong>3</strong> ou o algarismo <strong>6</strong>.</li><li>O <strong>antiperíodo</strong> contém as casas entre a vírgula e o início do período.</li><li>No método algébrico multiplicam-se duas vezes a dízima por potências de 10, até alinhar partes periódicas iguais, e depois subtraem-se as igualdades.</li><li>A fração final deve ser apresentada na forma irredutível.</li><li>Uma dízima periódica representa um valor <strong>exato</strong>; uma escrita arredondada é apenas uma aproximação.</li></ul><p class="note">No nível Especialista variam a parte inteira, o antiperíodo, as representações e as estratégias, mantendo sempre período 3 ou 6.</p>`;

function safeMath(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function draw(){current=make();document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));$('#tags').innerHTML=`<span class="tag">8.º ano</span><span class="tag">${['','Principiante','Intermédio','Especialista'][current.level]}</span><span class="tag">${names[current.category]}</span>`;$('#prompt').textContent=current.prompt;$('#statement').innerHTML=safeMath(current.statement);const verbal=/^[A-Za-zÀ-ÿ]/.test(current.answer)&&!current.answer.includes('\\'),answerHtml=current.answer.includes('\\(')?current.answer:`\\[${current.answer}\\]`;$('#answer').innerHTML=verbal?`<strong>${safeMath(current.answer)}</strong>`:safeMath(answerHtml);$('#choices').innerHTML=current.choices?current.choices.map((o,i)=>`<div class="choice"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o.includes('\\')?`\\(${safeMath(o)}\\)`:safeMath(o)}</span></div>`).join(''):'';$('#steps').innerHTML=current.steps.map(s=>`<div class="step${s.warning?' warning':''}"><div class="math">\\[${safeMath(s.math)}\\]</div>${s.reason?`<div class="reason">${safeMath(s.reason)}</div>`:''}</div>`).join('');$('#rules').innerHTML=rules;typeset()}
