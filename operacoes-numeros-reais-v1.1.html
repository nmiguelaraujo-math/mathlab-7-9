<script>
(()=>{'use strict';

const S=(math,reason='',warning=false)=>({math,reason,warning});
function E(prompt,statement,answer,steps,o={}){return{prompt,statement,answer,steps,visual:o.visual||'',choices:o.choices||null,correct:o.correct??null,family:o.family||'',calculator:o.calculator||false}}

function simpSquare(n){let s=1,r=n;for(let k=2;k*k<=r;k++){while(r%(k*k)===0){s*=k;r/=k*k}}return{s,r}}
function simpCube(n){const sign=n<0?-1:1;let r=Math.abs(n),s=1;for(let k=2;k*k*k<=r;k++){while(r%(k*k*k)===0){s*=k;r/=k*k*k}}return{s:s*sign,r}}
function rootTerm(c,r,index=2){if(c===0)return'0';if(r===1)return String(c);const root=index===2?`\\sqrt{${r}}`:`\\sqrt[3]{${r}}`;if(c===1)return root;if(c===-1)return`-${root}`;return`${c}${root}`}

function rootForm(level){

function rootOps(level){
  const type=pick(level===1?['product2','quotient2']:level===2?['product2','quotient2','coeff2','product3']:['coeff2','quotient2','product3','quotient3','mixedPower']);
  if(type==='product2'){const a=pick(sfBases.slice(0,5)),k=ri(2,level===1?6:10),b=a*k*k,ans=a*k;return E('Calcula, utilizando as propriedades das raízes.',`\\sqrt{${a}}\\times\\sqrt{${b}}`,String(ans),[S(`=\\sqrt{${a}\\times${b}}`,'Produto de raízes quadradas.'),S(`=\\sqrt{${ans*ans}}`),S(`=${ans}`)],{family:'produto-raizes-quadradas'})}

function expressions(level){
  if(level===1){const r=pick(sfBases.slice(0,6)),a=ri(2,7),b=ri(1,6),c=ri(1,5),coef=a-b+c,statement=`${a}\\sqrt{${r}}-${b}\\sqrt{${r}}+${c}\\sqrt{${r}}`;return E('Calcula e simplifica.',statement,rootTerm(coef,r),[S(`=(${a}-${b}+${c})\\sqrt{${r}}`,'Reduzem-se os termos semelhantes.'),S(`=${rootTerm(coef,r)}`)],{family:'termos-semelhantes'})}

  if(type==='distribute'){const r=pick(sfBases.slice(0,6)),a=ri(2,6),b=ri(1,7),sign=Math.random()<.5?-1:1,constant=a*r,coef=a*sign*b,inside=sign<0?`\\sqrt{${r}}-${b}`:`\\sqrt{${r}}+${b}`;return E('Calcula e simplifica.',`${a}\\sqrt{${r}}(${inside})`,sumTerms([[coef,r]],constant),[S(`=${a}\\sqrt{${r}}\\times\\sqrt{${r}}${sign<0?'-':'+'}${a*b}\\sqrt{${r}}`,'Aplica-se a propriedade distributiva.'),S(`=${constant}${coef<0?'-':'+'}${rootTerm(Math.abs(coef),r)}`)],{family:'distributiva'})}
  if(type==='conjugate'){const r=pick([2,3,5,6,7,10,11]),a=ri(1,5),ans=r-a*a;return E('Calcula e simplifica.',`(\\sqrt{${r}}-${a})(\\sqrt{${r}}+${a})`,String(ans),[S(`=(\\sqrt{${r}})^2-${a}^2`,'Aplica-se o produto da diferença pela soma.'),S(`=${r}-${a*a}`),S(`=${ans}`)],{family:'conjugados'})}
  if(type==='pi'){const a=ri(2,8),b=ri(1,6),c=ri(-5,5),coef=a-b,statement=`${a}\\pi-(${c}+${b}\\pi)`,piPart=coef===0?'':coef===1?'\\pi':coef===-1?'-\\pi':`${coef}\\pi`,constant=-c,answer=piPart?(constant===0?piPart:`${piPart}${constant>0?'+':''}${constant}`):String(constant);return E('Calcula e simplifica.',statement,answer,[S(`=${a}\\pi-${c}-${b}\\pi`,'Retiram-se os parênteses, alterando os sinais.'),S(`=${answer}`,'Reduzem-se os termos semelhantes.')],{family:'expressoes-pi'})}
  if(type==='multiRadical'){const r=pick(sfBases.slice(0,5)),s1=ri(2,6),s2=ri(2,6),a=ri(1,4),b=ri(1,4),c=ri(1,5),n1=s1*s1*r,n2=s2*s2*r,coef=a*s1-b*s2+c;return E('Calcula e simplifica completamente.',`${a}\\sqrt{${n1}}-${b}\\sqrt{${n2}}+${c}\\sqrt{${r}}`,rootTerm(coef,r),[S(`=${rootTerm(a*s1,r)}-${rootTerm(b*s2,r)}+${rootTerm(c,r)}`,'Simplificam-se todas as raízes.'),S(`=(${a*s1}-${b*s2}+${c})\\sqrt{${r}}`),S(`=${rootTerm(coef,r)}`)],{family:'varios-radicais'})}

function approx(level){
  const n=pick([2,3,5,6,7,10,11,13,17,19]),digits=level===1?1:level===2?2:pick([2,3]),v=Math.sqrt(n);

  if(level===2){const a=ri(2,6),value=a*v,ans=Number(value.toFixed(digits));return E(`Determina uma aproximação às centésimas.`,`${a}\\sqrt{${n}}`,fmt(ans),[S(`\\sqrt{${n}}\\approx${fmt(Number(v.toFixed(4)))}`),S(`${a}\\sqrt{${n}}\\approx${a}\\times${fmt(Number(v.toFixed(4)))}`),S(`\\approx${fmt(ans)}`,'Arredonda-se o resultado final às centésimas.')],{family:'aproximacao-expressao',calculator:true})}
  const a=ri(2,5),low=Number((v-0.0005).toFixed(3)),high=Number((v+0.0005).toFixed(3)),L=Number((3-a*high).toFixed(4)),H=Number((3-a*low).toFixed(4));return E(`Sabendo que \\(${fmt(low)}<\\sqrt{${n}}<${fmt(high)}\\), enquadra o valor da expressão.`,`3-${a}\\sqrt{${n}}`,`\(${fmt(L)}<3-${a}\\sqrt{${n}}<${fmt(H)}\)`,[S(`${fmt(-a*high)}<-${a}\\sqrt{${n}}<${fmt(-a*low)}`,'Ao multiplicar por um número negativo, invertem-se as desigualdades.'),S(`${fmt(L)}<3-${a}\\sqrt{${n}}<${fmt(H)}`)],{family:'enquadramento-negativo'})

function svgMath(value){return String(value).replace(/\\sqrt\[3\]\{([^{}]+)\}/g,'∛$1').replace(/\\sqrt\{([^{}]+)\}/g,'√$1').replace(/\\pi/g,'π').replace(/\\text\{([^{}]*)\}/g,' $1').replace(/\\,/g,' ')}
function squarePairSVG(big,small){big=svgMath(big);small=svgMath(small);return`<svg viewBox="0 0 560 300" role="img" aria-label="Dois quadrados unidos"><rect x="70" y="35" width="220" height="220" fill="#b9dcff" stroke="#2459d3" stroke-width="4"/><rect x="290" y="135" width="120" height="120" fill="#f8b7c5" stroke="#c43b62" stroke-width="4"/><text x="180" y="140" text-anchor="middle" font-size="20">lado: ${big}</text><text x="350" y="205" text-anchor="middle" font-size="18">lado: ${small}</text></svg>`}
function triangleSVG(side,height){side=svgMath(side);height=svgMath(height);return`<svg viewBox="0 0 560 310" role="img" aria-label="Triângulo"><polygon points="280,35 75,260 485,260" fill="#ffd77c" stroke="#c17a00" stroke-width="4"/><line x1="280" y1="35" x2="280" y2="260" stroke="#617086" stroke-width="2" stroke-dasharray="8 7"/><text x="165" y="145" font-size="19">${side}</text><text x="385" y="145" font-size="19">${side}</text><text x="300" y="155" font-size="19">h = ${height}</text></svg>`}
function ringSVG(R,r){R=svgMath(R);r=svgMath(r);return`<svg viewBox="0 0 520 330" role="img" aria-label="Coroa circular"><circle cx="260" cy="165" r="135" fill="#9ed6ff" stroke="#2459d3" stroke-width="4"/><circle cx="260" cy="165" r="62" fill="#fff" stroke="#2459d3" stroke-width="4"/><line x1="260" y1="165" x2="395" y2="165" stroke="#17243b" stroke-width="3"/><line x1="260" y1="165" x2="260" y2="103" stroke="#17243b" stroke-width="3"/><text x="325" y="153" font-size="18">R = ${R}</text><text x="270" y="128" font-size="18">r = ${r}</text></svg>`}
function trapezoidSVG(B,b,h){B=svgMath(B);b=svgMath(b);h=svgMath(h);return`<svg viewBox="0 0 620 300" role="img" aria-label="Trapézio retângulo"><polygon points="70,245 510,245 400,65 230,65" fill="#c9b6f6" stroke="#6947b8" stroke-width="4"/><line x1="400" y1="65" x2="400" y2="245" stroke="#617086" stroke-width="2" stroke-dasharray="8 7"/><text x="290" y="275" font-size="19">${B}</text><text x="300" y="52" font-size="19">${b}</text><text x="412" y="160" font-size="19">${h}</text></svg>`}
function problems(level){
  const types=level===1?['squares','triangle']:level===2?['squares','triangle','ring','trapezoid']:['squares','triangle','ring','trapezoid','comparison'];const type=pick(types);
  if(type==='squares'){const r=pick([2,3,5]),a=ri(2,5),b=ri(1,a),big=rootTerm(a,r),small=rootTerm(b,r),area=(a*a+b*b)*r,per=4*a*Math.sqrt(r)+2*b*Math.sqrt(r),coef=4*a+2*b;return E(`A figura é formada por dois quadrados unidos ao longo de um lado completo do quadrado menor. Os lados medem, respetivamente, \\(${big}\\) cm e \\(${small}\\) cm. Determina o perímetro da figura, na forma simplificada.`,'',`${rootTerm(coef,r)}\\text{ cm}`,[S(`P=4(${big})+4(${small})-2(${small})`,'Somam-se os perímetros e retiram-se as duas ocorrências do lado comum.'),S(`P=${rootTerm(4*a,r)}+${rootTerm(2*b,r)}`),S(`P=${rootTerm(coef,r)}\\text{ cm}`)],{family:'problema-quadrados',visual:squarePairSVG(big,small)})}
  if(type==='triangle'){const r=pick([2,3,5]),H=ri(2,5),h=rootTerm(H,r),base=ri(3,8),areaTex=`\\frac{${base}\\times${h}}2`,coef=H*base,answer=coef%2===0?`${rootTerm(coef/2,r)}\\text{ cm}^2`:`\\frac{${rootTerm(coef,r)}}2\\text{ cm}^2`;return E(`Um triângulo tem base ${base} cm e altura \\(${h}\\) cm. Determina a sua área em valor exato.`,'',answer,[S(`A=\\frac{b\\times h}{2}`),S(`A=${areaTex}`),S(`A=${answer}`)],{family:'problema-triangulo',visual:triangleSVG('lados iguais',`${h} cm`)})}
  if(type==='ring'){const r=pick([2,3,5]),A=ri(2,5),B=ri(1,A-1),R=rootTerm(A,r),inner=rootTerm(B,r),coef=(A*A-B*B)*r;return E(`Uma coroa circular tem raio exterior \\(${R}\\) cm e raio interior \\(${inner}\\) cm. Determina a sua área exata.`,'',`${coef}\\pi\\text{ cm}^2`,[S(`A=\\pi R^2-\\pi r^2`),S(`A=\\pi(${R})^2-\\pi(${inner})^2`),S(`A=${A*A*r}\\pi-${B*B*r}\\pi`),S(`A=${coef}\\pi\\text{ cm}^2`)],{family:'problema-coroa',visual:ringSVG(`${R} cm`,`${inner} cm`)})}
  if(type==='trapezoid'){const r=pick([2,3,5]),A=ri(3,7),B=ri(1,A-1),H=ri(2,5),big=rootTerm(A,r),small=rootTerm(B,r),h=rootTerm(H,r),sum=A+B,area=sum*H*r/2,ans=Number.isInteger(area)?`${area}\\text{ cm}^2`:`${fmt(area)}\\text{ cm}^2`;return E(`O trapézio retângulo tem bases \\(${big}\\) cm e \\(${small}\\) cm e altura \\(${h}\\) cm. Determina a sua área.`,'',ans,[S(`A=\\frac{(B+b)h}{2}`),S(`A=\\frac{(${big}+${small})${h}}2`),S(`A=\\frac{${sum}\\sqrt{${r}}\\times${H}\\sqrt{${r}}}{2}`),S(`A=${ans}`)],{family:'problema-trapezio',visual:trapezoidSVG(`${big} cm`,`${small} cm`,`${h} cm`)})}
  const n=pick([2,3,5,6,7]),a=ri(2,5),b=ri(1,5),exact=a*Math.sqrt(n)+b,approx=Number(exact.toFixed(2)),proposalB=Number((approx+pick([-.05,-.03,.03,.05])).toFixed(2)),answer=exact>proposalB?'Proposta A':'Proposta B';return E(`Uma empresa dispõe de duas propostas para uma peça. Na proposta A, o comprimento é \\(${a}\\sqrt{${n}}+${b}\\) cm. Na proposta B, o comprimento indicado é ${fmt(proposalB)} cm. Determina qual é maior, apresentando os cálculos necessários.`,'',answer,[S(`${a}\\sqrt{${n}}+${b}\\approx${fmt(approx)}\\text{ cm}`,'Calcula-se uma aproximação apenas para efetuar a comparação.'),S(`${fmt(approx)}${exact>proposalB?'>':'<'}${fmt(proposalB)}`),S(`\\text{A ${answer} apresenta o maior comprimento.}`)],{family:'problema-comparacao',calculator:true})
}

function selection(level){
  const type=pick(level===1?['equivalent','rule','simpleError']:level===2?['equivalent','rational','error','geometry']:['rational','error','bounds','twoTrue','geometryHard','efficient']);
  if(type==='equivalent'){const r=pick([2,3,5,6,7]),a=ri(1,4),correct=String(r+a*a-2*a*Math.sqrt(r));const ctex=`${r+a*a}-${rootTerm(2*a,r)}`;return MC(`Seleciona a expressão equivalente a \\((\\sqrt{${r}}-${a})^2\\).`,'',ctex,[`${r+a*a}+${rootTerm(2*a,r)}`,`${r-a*a}`,`${r+a*a}-${rootTerm(a,r)}`],[S(`(\\sqrt{${r}}-${a})^2=${r}-${rootTerm(2*a,r)}+${a*a}`),S(`=${ctex}`)],'selecao-caso-notavel')}
  if(type==='rule')return MC('Seleciona a igualdade verdadeira.','',`\\sqrt{12}\\times\\sqrt3=6`,[`\\sqrt{12}+\\sqrt3=\\sqrt{15}`,`\\sqrt{12}\\times\\sqrt3=\\sqrt{15}`,`\\sqrt{12}-\\sqrt3=\\sqrt9`],[S(`\\sqrt{12}\\times\\sqrt3=\\sqrt{36}=6`)],'selecao-propriedade');
  if(type==='simpleError')return MC('Um aluno escreveu \\(\\sqrt{18}=9\\sqrt2\\). Qual foi o erro?','',`confundiu \\(\\sqrt{9}\\) com 9`,['somou os fatores do radicando','trocou uma raiz quadrada por uma cúbica','não existe qualquer erro'],[S(`\\sqrt{18}=\\sqrt{9\\times2}=3\\sqrt2`,'A raiz quadrada de 9 é 3.')],'selecao-erro-simples');
  if(type==='rational'){const correct=`(\\sqrt5-2)(\\sqrt5+2)`;return MC('Qual das expressões representa um número racional?', '',correct,[`\\sqrt2+\\sqrt8`,`\\sqrt{12}-\\sqrt3`,`\\pi-\\sqrt2`],[S(`${correct}=5-4=1`),S(`\\sqrt2+\\sqrt8=3\\sqrt2`),S(`\\sqrt{12}-\\sqrt3=\\sqrt3`)],'selecao-racional')}
  if(type==='error'){const correct='Passagem 2';return MC('Em que passagem foi cometido o primeiro erro?',`\\begin{aligned}\\sqrt{12}+\\sqrt{27}&=2\\sqrt3+3\\sqrt3&&\\text{(1)}\\\\&=5\\sqrt6&&\\text{(2)}\\\\&\\approx12,25&&\\text{(3)}\\end{aligned}`,correct,['Passagem 1','Passagem 3','Não existe erro'],[S(`2\\sqrt3+3\\sqrt3=5\\sqrt3`,'Na passagem 2, somaram-se incorretamente os radicandos.',true)],'selecao-primeiro-erro')}
  if(type==='geometry'){const r=pick([2,3,5]),a=ri(2,5),side=rootTerm(a,r),correct=`${a*a*r}\\text{ cm}^2`;return MC(`Um quadrado tem lado \\(${side}\\) cm. Qual é a sua área?`,'',correct,[`${2*a*r}\\text{ cm}^2`,`${a*a}\\sqrt{${r}}\\text{ cm}^2`,`${4*a}\\sqrt{${r}}\\text{ cm}^2`],[S(`A=(${side})^2=${a*a*r}\\text{ cm}^2`)],'selecao-geometria')}
  if(type==='bounds'){const n=2,a=2,correct=`0,17<3-2\\sqrt2<0,172`;return MC('Sabendo que \\(1,414<\\sqrt2<1,415\\), qual é o enquadramento correto?','',correct,[`0,172<3-2\\sqrt2<0,17`,`0,17<3-2\\sqrt2<0,17`,`0,17<3-\\sqrt2<0,172`],[S(`-2,83<-2\\sqrt2<-2,828`,'Multiplica-se por -2 e invertem-se as desigualdades.'),S(`0,17<3-2\\sqrt2<0,172`)],'selecao-enquadramento')}
  if(type==='twoTrue'){const opts=shuffle([`\\sqrt2+\\sqrt8=3\\sqrt2`,`(\\sqrt3)^4=9`,`\\sqrt5+\\sqrt5=\\sqrt{10}`,`\\sqrt{18}\\div\\sqrt2=9`]);const correct='São verdadeiras as igualdades \\(\\sqrt2+\\sqrt8=3\\sqrt2\\) e \\((\\sqrt3)^4=9\\).';return E('Seleciona as duas afirmações verdadeiras.','',correct,[S(`\\sqrt2+\\sqrt8=\\sqrt2+2\\sqrt2=3\\sqrt2`),S(`(\\sqrt3)^4=((\\sqrt3)^2)^2=9`),S(`\\sqrt5+\\sqrt5=2\\sqrt5\\neq\\sqrt{10}`),S(`\\sqrt{18}\\div\\sqrt2=\\sqrt9=3\\neq9`)],{family:'selecao-duas-verdadeiras',choices:opts,correct:null})}
  if(type==='geometryHard'){const correct=`\\frac{13}{4}\\pi`;return MC('Uma coroa circular tem diâmetro exterior 4 cm e raio interior \\(\\frac{\\sqrt3}{2}\\) cm. Qual é a sua área?','',correct,[`\\frac54\\pi`,`\\frac{13}{2}\\pi`,`4\\pi-\\frac{\\sqrt3}{2}`],[S(`R=2,\\quad r=\\frac{\\sqrt3}{2}`),S(`A=\\pi(2^2)-\\pi(\\frac{\\sqrt3}{2})^2`),S(`A=4\\pi-\\frac34\\pi=\\frac{13}{4}\\pi`)],'selecao-geometria-dificil')}
  return MC('Qual é a forma mais eficiente de calcular a expressão?',`7\\sqrt3-2(\\sqrt3+4)-5\\sqrt3+8`,'aplicar a distributiva e reduzir termos semelhantes',['aproximar primeiro \\(\\sqrt3\\)','somar os radicandos','elevar toda a expressão ao quadrado'],[S(`7\\sqrt3-2\\sqrt3-8-5\\sqrt3+8=0`)],'selecao-estrategia')
}

function sanitize(e){const fields=['statement','answer'];for(const f of fields)e[f]=String(e[f]??'').replace(/--/g,'+').replace(/\+\-/g,'-');e.steps=e.steps.filter(Boolean).map(s=>({...s,math:String(s.math).replace(/--/g,'+').replace(/\+\-/g,'-')}));return e}
const generators={rootForm,rootOps,expressions,approx,problems,selection};
const names={rootForm:'Escrever na forma a√b',rootOps:'Produto e quociente de raízes',expressions:'Calcular e simplificar',approx:'Valores aproximados',problems:'Problemas',selection:'Seleção e análise de erros'};
let recent=[];
function make(){const level=+$('#level').value;let category=$('#category').value;if(category==='mixed')category=pick(level===1?['rootForm','rootOps','expressions','problems','selection']:level===2?['rootForm','rootOps','expressions','expressions','approx','problems','selection']:['rootForm','rootOps','expressions','expressions','expressions','approx','problems','problems','selection','selection']);let e=sanitize(generators[category](level)),tries=0;while(recent.includes(e.family)&&tries++<12)e=sanitize(generators[category](level));recent=[e.family,...recent].slice(0,4);return{...e,level,category}}
const rules=`<ul><li>Se \\(a\\geq0\\), então \\((\\sqrt a)^2=a\\) e \\(\\sqrt{a^2}=|a|\\).</li><li>Para \\(a,b\\geq0\\), \\(\\sqrt a\\sqrt b=\\sqrt{ab}\\).</li><li>Para \\(a\\geq0\\) e \\(b>0\\), \\(\\dfrac{\\sqrt a}{\\sqrt b}=\\sqrt{\\dfrac ab}\\).</li><li>Para quaisquer números reais \\(a\\) e \\(b\\), \\(\\sqrt[3]a\\sqrt[3]b=\\sqrt[3]{ab}\\).</li><li>Só se adicionam ou subtraem diretamente radicais semelhantes: \\(a\\sqrt n+b\\sqrt n=(a+b)\\sqrt n\\).</li><li>Antes de reduzir termos semelhantes, simplificam-se os radicais.</li><li>As propriedades comutativa, associativa e distributiva mantêm-se em \\(\\mathbb R\\).</li><li>Num cálculo aproximado, deve conservar-se precisão suficiente e arredondar apenas no final.</li></ul><p class="note">O valor exato mantém raízes e \\(\\pi\\). Só se usa uma aproximação decimal quando ela é pedida ou necessária para comparar valores.</p>`;
let current;
function typeset(){if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise()}
function isMath(s){return/[\\^_{}]|\\pi|\\sqrt|\\frac|\d/.test(s)&&!/^Proposta|^Passagem|^As duas|^aplicar|^confundiu|^É necessário/.test(s)}
function draw(){current=make();document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));$('#tags').innerHTML=`<span class="tag">9.º ano</span><span class="tag">${['','Principiante','Intermédio','Especialista'][current.level]}</span><span class="tag">${names[current.category]}</span>${current.calculator?'<span class="tag">Com calculadora</span>':''}`;$('#prompt').innerHTML=current.prompt;const hide=!current.statement;$('#statement').classList.toggle('hidden',hide);$('#statement').innerHTML=hide?'':`\\[${current.statement}\\]`;$('#visual').innerHTML=current.visual||'';$('#answer').innerHTML=isMath(current.answer)?`\\[${current.answer}\\]`:`<strong>${current.answer}</strong>`;$('#choices').innerHTML=current.choices?current.choices.map((o,i)=>`<div class="choice"><span class="letter">${String.fromCharCode(65+i)}</span><span>${isMath(o)?`\\(${o}\\)`:o}</span></div>`).join(''):'';$('#steps').innerHTML=current.steps.map(s=>`<div class="step${s.warning?' warning':''}"><div class="math">\\[${s.math}\\]</div>${s.reason?`<div class="reason">${s.reason}</div>`:''}</div>`).join('');$('#rules').innerHTML=rules;typeset()}
function toggle(id){$(id).classList.toggle('show');typeset()}
$('#new').onclick=draw;$('#answerBtn').onclick=()=>toggle('#answerPanel');$('#stepsBtn').onclick=()=>toggle('#stepsPanel');$('#rulesBtn').onclick=()=>toggle('#rulesPanel');['#level','#category'].forEach(id=>$(id).onchange=draw);
window.__reals={make,rootForm,rootOps,expressions,approx,problems,selection,simpSquare,simpCube,sanitize,svgMath};draw();
})();
</script>
