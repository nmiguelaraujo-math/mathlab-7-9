function problems(level){const type=pick(level===1?['square','cube']:level===2?['square','cube','garden','ribbon']:['garden','ribbon','aquarium','composite']);if(type==='square'){const side=ri(3,level===1?15:25),area=side*side;return E(`Um terreno quadrado tem ${area} m² de área. Determina o seu perímetro.`,'',`${4*side}\\text{ m}`,[S(`l=\\sqrt{${area}}=${side}\\text{ m}`,'Determina-se primeiro o lado do quadrado.'),S(`P=4\\times${side}=${4*side}\\text{ m}`)],{family:'problema-quadrado',visual:squareSVG(`${area} m²`,'Terreno')})}if(type==='cube'){const edge=ri(3,level===1?12:20),volume=edge**3;return E(`Uma caixa cúbica tem ${volume} cm³ de volume. Determina o comprimento da sua aresta.`,'',`${edge}\\text{ cm}`,[S(`a=\\sqrt[3]{${volume}}`,'Num cubo, o volume é o cubo da medida da aresta.'),S(`a=${edge}\\text{ cm}`)],{family:'problema-cubo',visual:cubeSVG(`${volume} cm³`)})}if(type==='garden'){const side=ri(5,16),area=side**2,w=pick([1,1.5,2]),outer=side+2*w,result=outer**2-area;return E(`Um jardim quadrado tem ${area} m² de área. À sua volta existe um passeio com ${fmt(w)} m de largura constante. Determina a área do passeio.`,'',`${fmt(result)}\\text{ m}^2`,[S(`l=\\sqrt{${area}}=${side}\\text{ m}`,'Determina-se o lado do jardim.'),S(`L=${side}+2\\times${fmt(w)}=${fmt(outer)}\\text{ m}`,'O passeio aumenta a medida nos dois lados.'),S(`A=${fmt(outer)}^2-${side}^2=${fmt(result)}\\text{ m}^2`,'Subtrai-se a área do jardim à área total.')],{family:'problema-jardim',visual:gardenSVG(`${area} m²`,w)})}if(type==='ribbon'){const edge=ri(5,20),volume=edge**3,bow=pick([30,40,50,60]),turns=pick([8,10,12]),total=turns*edge+bow;return E(`Uma caixa cúbica tem ${volume} cm³ de volume. A fita percorre, ao todo, ${turns} arestas da caixa e são necessários mais ${bow} cm para o laço. Quantos centímetros de fita são necessários?`,'',`${total}\\text{ cm}`,[S(`a=\\sqrt[3]{${volume}}=${edge}\\text{ cm}`,'Determina-se a aresta da caixa.'),S(`${turns}\\times${edge}+${bow}=${total}\\text{ cm} function selection(level){const type=pick(level===1?['mc','trueFalse']:level===2?['mc','trueFalse','error']:['error','largest','irrational','strategy']);if(type==='mc'){const cube=Math.random()<.5,a=ri(2,12),n=cube?a**3:a*a,correct=String(a);return MC('Seleciona o valor correto.',cube?`\\sqrt[3]{${n}}`:`\\sqrt{${n}}`,correct,[String(-a),String(cube?a*a:a**3),String(a+1)],[S(cube?`\\sqrt[3]{${n}}=${a}`:`\\sqrt{${n}}=${a}`)],'seleção-direta')}if(type==='trueFalse'){const cube=Math.random()<.5,a=ri(2,10),truth=Math.random()<.5,n=cube?a**3:a*a,candidate=truth?a:a+pick([-2,-1,1,2]);return E('Indica se a igualdade é verdadeira ou falsa.',cube?`\\sqrt[3]{${n}}=${candidate}`:`\\sqrt{${n}}=${candidate}`,truth?'Verdadeira':'Falsa',[S(cube?`\\sqrt[3]{${n}}=${a}`:`\\sqrt{${n}}=${a}`),S(`\\text{A igualdade é ${truth?'verdadeira':'falsa'}.}`)],{family:'verdadeiro-falso'})}if(type==='error'){const cube=Math.random()<.5,a=ri(2,10),n=cube?a**3:a*a,wrong=cube?-a:-a;return E('A resolução apresentada contém um erro. Identifica-o e corrige o resultado.',cube?`\\sqrt[3]{${n}}=${wrong}`:`\\sqrt{${n}}=${wrong}`,String(a),[S(cube?`\\sqrt[3]{${n}}=${a}`:`\\sqrt{${n}}=${a}`,cube?'A raiz cúbica tem o mesmo sinal do radicando.':'A raiz quadrada de um número não negativo é, por definição, não negativa.',true)],{family:'analisar-erro'})}if(type==='largest'){const vals=[ri(-6,-1),ri(2,8),ri(2,7),ri(2,10)],opts=[`\\sqrt[3]{${vals[0]**3}}-\\sqrt{${vals[1]**2}}`,`(\\sqrt{${vals[1]**2}})^2-\\sqrt[3]{${vals[2]**3}}`,`2\\sqrt[3]{${vals[2]**3}}-\\sqrt{${vals[3]**2}}`,`\\sqrt{${vals[3]**2}}-\\sqrt[3]{${vals[0]**3}}`],numbers=[vals[0]-vals[1],vals[1]**2-vals[2],2*vals[2]-vals[3],vals[3]-vals[0]],mx=Math.max(...numbers),correct=opts[numbers.indexOf(mx)],sh=shuffle(opts);return E('Seleciona a expressão com maior valor.', '',correct,numbers.map((v,i)=>S(`${opts[i]}=${v}`)),{family:'seleção-maior',choices:sh,correct:sh.indexOf(correct)})}if(type==='irrational'){const n=nonSquare(),correct=`\\sqrt{${n}}`,opts=shuffle([correct,`\\sqrt{${ri(2,12)**2}}`,`\\sqrt[3]{${ri(2,7)**3}}`,`\\frac{${ri(1,9)}}{${ri(2,10)}}`]);return E('Seleciona o número irracional.','',correct,[S(`${correct}\\notin\\mathbb Q`,`${n} não é um quadrado perfeito.`)],{family:'seleção-irracional',choices:opts,correct:opts.indexOf(correct)})}const area=pick([18,30,45,61,75]);return MC('Para estimar o lado de um quadrado a partir da sua área, qual é a primeira estratégia adequada?',`A=${area}\\text{ cm}^2`,'enquadrar a área entre dois quadrados perfeitos',['dividir a área por 2','calcular o cubo da área','arredondar a área antes de calcular'],[S(`${Math.floor(Math.sqrt(area))}^2<${area}<${Math.ceil(Math.sqrt(area))}^2`)],'seleção-estratégia')}
function cleanExpressions(e){e.steps=e.steps.map(s=>({...s,math:s.math.replace(/--(\d+)/g,'+$1').replace(/-\\\\frac\{-(\d+)\}/g,'+\\\\frac{$1}')}));return e}
const generators={perfect,roots,complete,compare,expressions:level=>cleanExpressions(expressions(level)),approx,problems,selection},names={perfect:'Quadrados e cubos perfeitos',roots:'Calcular raízes',complete:'Completar',compare:'Comparar e ordenar',expressions:'Expressões',approx:'Valores aproximados',problems:'Problemas',selection:'Seleção e análise de erros'};let recent=[];function make(){const level=+$('#level').value;let category=$('#category').value;if(category==='mixed')category=pick(level===1?['perfect','roots','complete','compare','expressions','problems','selection']:level===2?['perfect','roots','complete','compare','expressions','approx','problems','selection']:['roots','complete','compare','expressions','expressions','approx','problems','problems','selection']);let e=generators[category](level),tries=0;while(recent.includes(e.family)&&tries++<8)e=generators[category](level);recent=[e.family,...recent].slice(0,3);return {...e,level,category}}
const rules=`<ul><li>Se \\(a\\geq0\\), então \\(\\sqrt{a}\\) é o número não negativo cujo quadrado é \\(a\\).</li><li>A raiz quadrada de um número negativo não é um número real.</li><li>\\(\\sqrt[3]{a}\\) é o número cujo cubo é \\(a\\); pode ser positivo, zero ou negativo.</li><li>\\(\\sqrt{a^2}=|a|\\) e \\(\\sqrt[3]{a^3}=a\\).</li><li>Num quadrado, \\(A=l^2\\), logo \\(l=\\sqrt A\\).</li><li>Num cubo, \\(V=a^3\\), logo \\(a=\\sqrt[3]V\\).</li><li>Se \\(n^2<a<(n+1)^2\\), então \\(n<\\sqrt a<n+1\\).</li><li>Numa cadeia de cálculos utilizam-se sinais de igualdade; respeita-se sempre a prioridade das operações.</li></ul><p class="note">Os exercícios de aproximação indicam quando é adequado utilizar calculadora.</p>`;
