function draw(){current=make();document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));$('#tags').innerHTML=`<span class="tag">9.º ano</span><span class="tag">${['','Principiante','Intermédio','Especialista'][current.level]}</span><span class="tag">${labels[current.category]}</span>`;$('#prompt').innerHTML=current.prompt;$('#statement').classList.toggle('hidden',current.model);$('#statement').innerHTML=current.model?'':current.statement;$('#answer').innerHTML=`\\[S=${current.interval}\\]`;$('#steps').innerHTML=current.steps.map((s,i)=>`<div class="step ${s.kind==='model'?'model':''}"><div class="math">\\[${s.kind==='calc'&&i>0?'\\Leftrightarrow ':''}${s.math}\\]</div>${s.reason?`<div class="reason">${s.reason}</div>`:''}</div>`).join('')+`<div class="step"><div class="math">\\[S=${current.interval}\\]</div><div class="reason">Escreve-se o conjunto-solução na forma de intervalo de números reais.</div></div>`;$('#graph').innerHTML=`<h3>Representação gráfica da solução</h3>${graphSVG(current.op,current.boundary)}`;$('#interpretation').innerHTML=current.interpretation?`<div class="interpretation"><strong>Interpretação:</strong> ${current.interpretation}</div>`:'';$('#rules').innerHTML=rules;typeset()}
function toggle(id){$(id).classList.toggle('show');typeset()}$('#new').onclick=draw;$('#answerBtn').onclick=()=>toggle('#answerPanel');$('#stepsBtn').onclick=()=>toggle('#stepsPanel');$('#rulesBtn').onclick=()=>toggle('#rulesPanel');['#level','#category'].forEach(id=>$(id).onchange=draw);window.__inequalities={make,solve,problem,Q,interval,flip,graphSVG};draw();
})();
</script><script src="voltar.js"></script></body></html>
